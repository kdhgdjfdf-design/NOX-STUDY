<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<title>NOX STUDY</title>
<style>
:root{--bg:#f3ebdd;--surface:#fffaf1;--ink:#34291f;--muted:#827365;--line:#dfd0bc;--gold:#9a6b43;--red:#b96552;--green:#5f8064;--white:#fffdf8;--shadow:0 8px 28px #4b32120d}
[data-theme="dark"]{--bg:#1e1a17;--surface:#2b241f;--ink:#f6eee4;--muted:#c2b2a1;--line:#493b30;--gold:#d5a579;--red:#df8d78;--green:#9bb99a;--white:#332a23;--shadow:0 8px 28px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;padding:18px 15px 42px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px 18px}
.brand{display:flex;align-items:center;gap:11px}.mark{width:43px;height:43px;border-radius:15px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:850;letter-spacing:1px}.brand h1{font-size:21px;letter-spacing:1.5px;margin:0;font-weight:850}.brand p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:18px}
h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:15px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.small-btn{background:transparent;color:var(--gold);padding:5px 0;font-size:13px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 15px}.home-timetable{display:grid;gap:6px}.home-slot{display:grid;grid-template-columns:76px 1fr;gap:7px;align-items:stretch}.home-slot time{font-size:11px;color:var(--muted);padding:9px 2px;align-self:center}.home-slot button{min-height:42px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:right;padding:8px 10px;font-size:12px}.home-slot button.filled{border-style:solid;background:#e9e9fb;border-color:#d6d5f3;color:#45417f;font-weight:700}
.day{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 1px;text-align:center;color:var(--muted);font-size:11px}
.day b{display:block;font-size:13px;color:var(--ink);margin-top:2px}
.day.today{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.today b{color:var(--bg)}
.today-note{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.pill{border-radius:999px;padding:4px 9px;background:var(--bg);color:var(--muted);font-size:11px;white-space:nowrap}
.sections{display:grid;gap:10px}
.section-card{display:flex;align-items:center;gap:13px;min-height:77px;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:right;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}
.section-card{animation:riseIn .42s cubic-bezier(.2,.7,.2,1) both}.section-card:nth-child(2){animation-delay:.04s}.section-card:nth-child(3){animation-delay:.08s}.section-card:nth-child(4){animation-delay:.12s}@keyframes riseIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.section-card:active{transform:scale(.99)}button,input,select,textarea{transition:background .18s,border-color .18s,box-shadow .18s}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.section-icon{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.red .section-icon{background:#f4e3d8;color:#9b503a}.focus .section-icon{background:#eee1cf;color:#815a38}.green .section-icon{background:#e4eadc;color:#49694d}
.section-copy{flex:1;min-width:0}.section-copy strong{display:block;font-size:15px}.section-copy span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.chevron{font-size:19px;color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.mini{padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.mini strong{display:block;font-size:13px}.mini span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.hidden{display:none!important}.back{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--muted);padding:0;margin-bottom:14px}
.action{background:var(--ink);color:var(--bg);border-radius:13px;padding:11px 15px;font-weight:700}.action.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.field{margin:13px 0}.field label{display:block;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{margin-top:6px;accent-color:var(--gold)}.task span{flex:1}.task small{display:block;color:var(--muted);font-size:12px}
.subject-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.subject-row:last-child{border-bottom:0}
.timer{font-size:42px;font-weight:800;letter-spacing:1px;text-align:center;margin:16px 0;font-variant-numeric:tabular-nums}
.notice{font-size:12px;color:var(--muted);background:var(--bg);padding:10px 12px;border-radius:12px;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 4px}
.pdf-reader-overlay{position:fixed!important;inset:0;z-index:9999;background:var(--bg);padding:12px!important;margin:0!important;border-radius:0!important;overflow:auto;display:flex;flex-direction:column;min-height:100dvh}.pdf-reader-overlay iframe{width:100%;height:calc(100dvh - 150px)!important;flex:1;min-height:60vh;border:1px solid var(--line);border-radius:12px;background:white}.pdf-stage{position:relative;flex:1;min-height:60vh}.pdf-stage iframe{display:block}.pdf-ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}.pdf-ink.active{pointer-events:auto}.pdf-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}.pdf-tools button{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 11px;color:var(--ink);font-weight:650}.pdf-tools button.active{outline:2px solid var(--gold);background:var(--white)}.pdf-reader-overlay .panel-head{position:sticky;top:0;background:var(--surface);z-index:2;padding:8px;border-radius:12px}
@media(min-width:560px){.app{padding:26px 24px 50px}.sections{grid-template-columns:1fr 1fr}.section-card{min-height:88px}.panel{padding:20px}}

[data-theme="dark"]{--bg:#101827;--surface:#182337;--ink:#edf3ff;--muted:#a5b2c7;--line:#2b3a52;--gold:#8baeff;--red:#263958;--green:#233e59;--white:#202e44;--shadow:0 8px 24px #0003}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;background:var(--bg)}
.app{max-width:820px;padding:18px 16px 44px}header{padding:10px 2px 24px}.mark{background:#356ae6;color:#fff;border-radius:14px}.brand h1{letter-spacing:.4px;font-size:22px}
.panel{border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:var(--shadow);margin-bottom:16px}
.section-card{border:1px solid var(--line);border-radius:17px;box-shadow:0 3px 12px rgba(29,48,86,.035);background:var(--surface);min-height:82px}
.section-icon{background:#edf2ff!important;color:#356ae6!important;border-radius:13px}.red .section-icon{background:#edf2ff!important;color:#356ae6!important}.focus .section-icon{background:#e8f6ef!important;color:#25835c!important}.green .section-icon{background:#fff0e7!important;color:#b45c2c!important}
.action{background:#356ae6;color:white;border-radius:12px}.action.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

.home-slot button{background:var(--surface);border-color:var(--line);border-radius:10px}.home-slot button.filled{background:#eaf0ff;border-color:#c9d8ff;color:#254eb5}.mini{border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.notice{background:#f0f4fb;color:var(--muted)}[data-theme="dark"] .notice{background:#202d42}
.pdf-reader-overlay{background:var(--bg)}.pdf-reader-overlay .panel-head{background:var(--surface);border:1px solid var(--line)}
.pdf-tools{position:sticky;top:58px;z-index:5;background:var(--bg);padding:10px 0;gap:7px}
.pdf-tools button{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--ink);font-weight:700}
.pdf-tools button.active{outline:2px solid #356ae6;background:#eaf0ff;color:#244fb6}.pdf-tools .small-btn{color:var(--ink)}
.pdf-ink{z-index:3}.pdf-stage{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:white}

.pen-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pen-toolbar button{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 12px;font-weight:700}
.pen-toolbar button.active{background:#eaf0ff;border-color:#9db8ff;color:#244fb6}
#noteCanvas{display:block;width:100%;height:340px;background:white;border:1px solid #dbe3ef;border-radius:12px;touch-action:none}
@media(max-width:420px){.app{padding:13px 12px 35px}.panel{padding:15px}.section-card{padding:12px}.brand h1{font-size:20px}.pdf-tools button{padding:9px 10px}}


/* Study workspace: calm dashboard + immersive PDF reader */
:root{--bg:#f4f6fb;--surface:#fff;--ink:#182338;--muted:#6b778c;--line:#e1e7f0;--gold:#356ae6;--red:#e8efff;--green:#dce8ff;--white:#f8faff;--shadow:0 5px 22px rgba(29,48,86,.06)}
[data-theme="dark"]{--bg:#101827;--surface:#182337;--ink:#edf3ff;--muted:#a5b2c7;--line:#2b3a52;--gold:#8baeff;--red:#263958;--green:#233e59;--white:#202e44;--shadow:0 8px 24px #0003}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);line-height:1.6}
.app{max-width:920px}.panel,.section-card,.mini{border-radius:18px;box-shadow:var(--shadow)}.section-card{background:var(--surface);border:1px solid var(--line);min-height:90px}.section-icon{border-radius:14px;background:#edf2ff!important;color:#356ae6!important}.action{background:#356ae6;color:#fff;border-radius:12px}.action.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pdf-reader-overlay{position:fixed!important;inset:0!important;width:100vw;height:100dvh;min-height:100dvh;z-index:99999;background:var(--bg);padding:10px max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))!important;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.pdf-reader-overlay .panel-head{position:relative;top:auto;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:14px}
.pdf-reader-overlay .panel-head h3{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-tools{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.pdf-tools button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font-weight:700}
.pdf-tools button.active{outline:2px solid #356ae6;background:#eaf0ff;color:#244fb6}

.pdf-stage iframe{width:100%;height:100%!important;min-height:0!important;border:0;border-radius:0;display:block}
.pdf-ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}.pdf-ink.active{pointer-events:auto}
.pdf-reader-overlay>.notice{flex:0 0 auto;margin:0;padding:7px 10px;max-height:54px;overflow:auto}
.pdf-notes-panel{display:none;flex:0 0 34%;min-height:150px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;overflow:auto}
.pdf-notes-panel.open{display:flex;flex-direction:column;gap:8px}
.pdf-notes-panel textarea{width:100%;min-height:100px;flex:1;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
.pdf-reader-overlay.notes-open .pdf-stage{flex:1.2}
@media(max-width:560px){.pdf-reader-overlay{padding:7px!important;gap:6px}.pdf-reader-overlay .panel-head{padding:8px}.pdf-tools{gap:5px}.pdf-tools button{padding:8px;font-size:13px}.pdf-reader-overlay>.notice{font-size:10px}.pdf-notes-panel{flex-basis:38%}}

<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">N</div><div><h1>NOX STUDY</h1><p>مساحتك الهادئة للدراسة</p></div></div>
  <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات" title="الإعدادات">⚙</button>
</header>

<main id="home">
  <section class="panel">
    <div class="panel-head"><div><h2>جدولي الأسبوعي</h2><p class="sub" style="margin:3px 0 0">نظرة سريعة على أسبوعك</p></div><button class="small-btn" data-open="timetable">عرض الجدول ←</button></div>
    <div class="week" id="week"></div><div id="homeTimetable" class="home-timetable"></div>
    <div class="today-note"><span id="todayLabel">خطة اليوم</span><span class="pill" id="classCount">لا توجد حصص مضافة</span></div>
  </section>

  <div class="panel-head" style="padding:0 3px"><div><h2>أقسامك</h2><p class="sub" style="margin:3px 0 0">كل شيء في مكان واضح</p></div></div>
  <div class="sections">
    <button class="section-card red" data-open="summaries"><span class="section-icon">▤</span><span class="section-copy"><strong>الملخصات</strong><span>ملخصاتك، ملفاتك، والبطاقات التعليمية</span></span><span class="chevron">‹</span></button>
    <button class="section-card focus" data-open="tasks"><span class="section-icon">✓</span><span class="section-copy"><strong>المهام</strong><span>واجباتك ومواعيد الاختبارات</span></span><span class="chevron">‹</span></button>
    <button class="section-card focus" data-open="wellbeing"><span class="section-icon">◷</span><span class="section-copy"><strong>التركيز ووقت الشاشة</strong><span>جلساتك وأهداف استخدامك في مكان واحد</span></span><span class="chevron">‹</span></button>
    <button class="section-card green" data-open="notebook"><span class="section-icon">✎</span><span class="section-copy"><strong>دفتر الكتابة بالقلم</strong><span>اكتب وارسم واحفظ ملاحظاتك على هذا الجهاز</span></span><span class="chevron">‹</span></button>
  </div>
  <div class="mini-grid">
    <div class="mini"><strong>مهامك القادمة</strong><span id="nextTask">أضف أول مهمة دراسية</span></div>
    <div class="mini"><strong>تقدم هذا الأسبوع</strong><span id="progress">ابدأ أول جلسة لتتبع تقدمك</span></div>
  </div>
</main>

<section class="hidden" id="view"></section>
<footer>NOX STUDY · بسيط، هادئ، وعلى طريقتك</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const days=[["الإثنين","إث"],["الثلاثاء","ثل"],["الأربعاء","أر"],["الخميس","خم"],["الجمعة","جم"],["السبت","سب"],["الأحد","أح"]];
const navStack=[];const state={theme:localStorage.getItem("noxTheme")||"light",tasks:JSON.parse(localStorage.getItem("noxTasks")||"[]"),sessions:Number(localStorage.getItem("noxSessions")||0),timetable:JSON.parse(localStorage.getItem("noxTimetable")||"{}")};
document.documentElement.dataset.theme=state.theme==="dark"?"dark":"light";
function save(){localStorage.setItem("noxTasks",JSON.stringify(state.tasks));localStorage.setItem("noxSessions",String(state.sessions));localStorage.setItem("noxTimetable",JSON.stringify(state.timetable));}
function renderWeek(){
 const now=new Date(), js=now.getDay(), idx=js===0?6:js-1;
 $("#week").innerHTML=days.map((d,i)=>`<div class="day ${i===idx?"today":""}"><span>${d[1]}</span><b>${i===idx?"اليوم":i+1}</b></div>`).join("");
 const slots=[["08:30","09:20"],["09:30","10:20"],["10:30","11:20"],["11:30","12:20"],["14:00","14:50"],["15:00","15:50"]];
 $("#homeTimetable").innerHTML=slots.map((t,i)=>{const item=(state.timetable[days[idx][0]]||[])[i];return `<div class="home-slot"><time>${t[0]}–${t[1]}</time><button class="${item&&item.subject?'filled':''}" data-home-slot="${i}">${item&&item.subject?escapeHtml(item.subject):'+ أضف مادة أو مهمة'}</button></div>`}).join("");
 $("#todayLabel").textContent="خطة "+days[idx][0];
 const count=(state.timetable[days[idx][0]]||[]).filter(x=>x.subject).length;
 $("#classCount").textContent=count?count+" حصص مضافة":"لا توجد حصص مضافة";
 const upcoming=state.tasks.find(t=>!t.done);$("#nextTask").textContent=upcoming?upcoming.text:"أضف أول مهمة دراسية";
 $("#progress").textContent=state.sessions?state.sessions+" جلسة تركيز مكتملة":"ابدأ أول جلسة لتتبع تقدمك";
}
function openView(id,push=true){
 const v=$("#view");const current=v.dataset.current||"home";if(push&&current!==id)navStack.push(current);
 $("#home").classList.add("hidden");v.classList.remove("hidden");v.dataset.current=id;
 const back='<button class="back" data-back>→ رجوع خطوة</button>';
 const views={
 notebook:`${back}<section class="panel"><h2>دفتر الكتابة بالقلم</h2><p class="sub">مساحة كتابة سريعة للملاحظات والرسومات. تُحفظ على هذا الجهاز.</p><div class="pen-panel"><div class="pen-toolbar"><button class="active" data-note-mode="pen">✎ قلم</button><button data-note-mode="highlighter">🖍 تظليل</button><button data-note-mode="eraser">⌫ ممحاة</button><button id="clearNote">مسح الصفحة</button><label>السُمك <input id="noteWidth" type="range" min="2" max="16" value="4" style="width:90px;vertical-align:middle"></label></div><canvas id="noteCanvas" aria-label="دفتر الكتابة بالقلم"></canvas></div><p class="notice">القلم يعمل باللمس أو الماوس. استخدم قلم PDF من شريط الأدوات عند فتح ملف PDF.</p></section>`,
tasks:`${back}<section class="panel"><h2>مهامي</h2><p class="sub">قسّم الدراسة إلى خطوات صغيرة وحدد ما أنجزته.</p><div class="field"><label>المهمة</label><input id="taskText" placeholder="مثال: حل تمارين الرياضيات"></div><div class="field"><label>الموعد (اختياري)</label><input id="taskDue" type="date"></div><button class="action" id="addTask">＋ إضافة مهمة</button><div id="taskList" style="margin-top:12px"></div></section>`,
 summaries:`${back}<section class="panel"><h2>الملخصات</h2><p class="sub">اجمع دروسك وأدوات المراجعة في مكان واحد.</p><div class="task" role="button" tabindex="0" data-open="folders"><span>📁<b> مجلداتي</b><small>نظّم المواد والدروس والملفات.</small></span></div><div class="task" role="button" tabindex="0" data-open="cards"><span>🃏<b> البطاقات التعليمية</b><small>راجع ما تعرفه وما يحتاج إلى تدريب.</small></span></div><div class="task" role="button" tabindex="0" data-open="tutor"><span>🧠<b> مساعد الدراسة</b><small>نموذج أولي لواجهة المساعد؛ لم يُربط بعد بمحرك ذكاء اصطناعي.</small></span></div><div class="notice">رفع ملفات PDF والصور وتوليد الملخصات والاختبارات سيُبنى في مرحلة الملفات، بعد تجهيز الأساس.</div></section>`,

function paintForest(grown){const n=Number(localStorage.getItem("noxForestTrees")||0),t=$("#forestTree"),title=$("#forestTitle"),hint=$("#forestHint"),count=$("#forestCount");if(!t)return;t.textContent=grown?"🌳":n>=5?"🌲":n>=2?"🌿":"🌱";title.textContent=grown?"أحسنت! نمت شجرة جديدة":n?"غابتك تكبر بهدوء":"ازرع شجرتك الأولى";hint.textContent=grown?"أنهيت جلسة تركيز كاملة. خذ استراحة قصيرة ثم واصل.":"ابدأ جلسة تركيز؛ أكملها لتضيف شجرة إلى غابتك.";count.textContent="🌳 "+n+" شجرة مكتملة"}
function renderTasks(){const el=$("#taskList");if(!el)return;el.innerHTML=state.tasks.length?state.tasks.map((t,i)=>`<div class="task"><input type="checkbox" data-task-done="${i}" ${t.done?"checked":""} aria-label="تم الإنجاز"><span style="${t.done?"text-decoration:line-through;opacity:.6":""}">${escapeHtml(t.text)}<small>${t.due?"الموعد: "+escapeHtml(t.due):"دون موعد محدد"}</small></span><button class="small-btn" data-task-delete="${i}">حذف</button></div>`).join(""):"<p class=\"sub\">لا توجد مهام بعد. أضف أول مهمة فوق.</p>";el.querySelectorAll("[data-task-done]").forEach(x=>x.onchange=()=>{state.tasks[+x.dataset.taskDone].done=x.checked;save();renderTasks();renderWeek()});el.querySelectorAll("[data-task-delete]").forEach(x=>x.onclick=()=>{state.tasks.splice(+x.dataset.taskDelete,1);save();renderTasks();renderWeek()})}
let inkMode="pen",inkDrawing=false,inkLast=null;
function initPdfInk(fileId){
 const canvas=$("#pdfInk"),stage=canvas.parentElement,ctx=canvas.getContext("2d"),key="noxPdfInk:"+fileId;
 let strokes=[];try{strokes=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
 const resize=()=>{const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";draw()};
 const draw=()=>{const d=window.devicePixelRatio||1;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(d,0,0,d,0,0);for(const s of strokes){if(!s.points?.length)continue;ctx.beginPath();ctx.moveTo(s.points[0].x*canvas.clientWidth,s.points[0].y*canvas.clientHeight);for(const p of s.points.slice(1))ctx.lineTo(p.x*canvas.clientWidth,p.y*canvas.clientHeight);ctx.strokeStyle=s.mode==="highlighter"?"rgba(255,204,0,.35)":s.color||"#245bd7";ctx.lineWidth=s.width;ctx.lineCap="round";ctx.lineJoin="round";ctx.globalCompositeOperation=s.mode==="eraser"?"destination-out":"source-over";ctx.stroke()}ctx.globalCompositeOperation="source-over"};
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(strokes))}catch{alert("مساحة التخزين ممتلئة؛ تعذر حفظ الكتابة")}};
 const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
 canvas.onpointerdown=e=>{if(!canvas.classList.contains("active"))return;canvas.setPointerCapture(e.pointerId);inkDrawing=true;const p=pos(e);inkLast=p;strokes.push({mode:inkMode,width:Number($("#inkWidth").value),color:"#245bd7",points:[p]});draw()};
 canvas.onpointermove=e=>{if(!inkDrawing)return;strokes[strokes.length-1].points.push(pos(e));draw()};
 const finish=()=>{if(inkDrawing){inkDrawing=false;inkLast=null;save();draw()}};canvas.onpointerup=finish;canvas.onpointercancel=finish;
 document.querySelectorAll("[data-ink-mode]").forEach(b=>b.onclick=()=>{inkMode=b.dataset.inkMode;canvas.classList.add("active");document.querySelectorAll("[data-ink-mode]").forEach(q=>q.classList.toggle("active",q===b))});
 $("#clearInk").onclick=()=>{if(confirm("مسح كل الكتابة المحفوظة لهذا الملف؟")){strokes=[];save();draw()}};
 if(!window.noxInkResizeBound){window.addEventListener("resize",()=>{if(window.noxCurrentFileId)resize()});window.noxInkResizeBound=true}
 document.querySelector('[data-ink-mode="pen"]')?.click();resize();
}
function initNotebook(){
 const canvas=$("#noteCanvas"),ctx=canvas.getContext("2d"),key="noxNotebookStrokes";let mode="pen",drawing=false,strokes=[];try{strokes=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
 const resize=()=>{const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(340*d);draw()};
 const draw=()=>{const d=window.devicePixelRatio||1;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width/d,canvas.height/d);for(const s of strokes){if(!s.points.length)continue;ctx.beginPath();ctx.moveTo(s.points[0].x*canvas.clientWidth,s.points[0].y*340);for(const p of s.points.slice(1))ctx.lineTo(p.x*canvas.clientWidth,p.y*340);ctx.lineWidth=s.width;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=s.mode==="highlighter"?"rgba(255,204,0,.35)":"#245bd7";ctx.globalCompositeOperation=s.mode==="eraser"?"destination-out":"source-over";ctx.stroke()}ctx.globalCompositeOperation="source-over"};
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(strokes))}catch{alert("تعذر حفظ الملاحظات؛ مساحة التخزين ممتلئة.")}};
 const pos=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);strokes.push({mode,width:Number($("#noteWidth").value),points:[pos(e)]});draw()};
 canvas.onpointermove=e=>{if(!drawing)return;strokes[strokes.length-1].points.push(pos(e));draw()};
 const finish=()=>{if(drawing){drawing=false;save()}};canvas.onpointerup=finish;canvas.onpointercancel=finish;
 document.querySelectorAll("[data-note-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.noteMode;canvas.dataset.mode=mode;document.querySelectorAll("[data-note-mode]").forEach(x=>x.classList.toggle("active",x===b))});
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);strokes.push({mode:canvas.dataset.mode||"pen",width:Number($("#noteWidth").value),points:[pos(e)]});draw()};
 $("#clearNote").onclick=()=>{if(confirm("مسح كل ما كُتب في الدفتر؟")){strokes=[];save();draw()}};resize();window.addEventListener("resize",resize);
}
function fileDB(){return new Promise((ok,no)=>{const r=indexedDB.open("noxStudyFileStore",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function putStoredFile(item){const db=await fileDB();return new Promise((ok,no)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(item);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>{db.close();no(tx.error)}})}async function readStoredFile(id){const db=await fileDB();return new Promise((ok,no)=>{const q=db.transaction("files","readonly").objectStore("files").get(id);q.onsuccess=()=>{db.close();ok(q.result)};q.onerror=()=>{db.close();no(q.error)}})}async function renderFolders(){let a=JSON.parse(localStorage.getItem("noxFolders")||"[]");$("#folderList").innerHTML=a.length?a.map((x,i)=>`<div class="task"><span>📄 ${escapeHtml(typeof x==="string"?x:x.name)}<small>${escapeHtml(x.fileName||"ملف")} · ${Math.round((x.size||0)/1024)} KB</small></span><div class="actions"><button class="small-btn" data-open-file="${escapeHtml(x.id||"")}">فتح</button><button class="small-btn" data-del-folder="${i}">حذف</button></div></div>`).join(""):"<p>لا توجد ملفات بعد.</p>";document.querySelectorAll("[data-open-file]").forEach(b=>b.onclick=async()=>{try{const rec=await readStoredFile(b.dataset.openFile);if(!rec){alert("هذا ملف قديم أو لم يُحفظ محتواه؛ أعد اختياره من الهاتف.");return}if(!(rec.type==="application/pdf"||rec.fileName.toLowerCase().endsWith(".pdf"))){alert("فتح الملفات داخل التطبيق متاح حاليًا لملفات PDF فقط.");return}if(window.noxPdfUrl)URL.revokeObjectURL(window.noxPdfUrl);window.noxPdfUrl=URL.createObjectURL(rec.blob);$("#pdfTitle").textContent=rec.name;window.noxCurrentFileId=rec.id;$("#pdfFrame").src=window.noxPdfUrl;$("#pdfReader").classList.remove("hidden");$("#pdfReader").classList.remove("notes-open");$("#pdfNotesPanel").classList.remove("open");$("#pdfNotesText").value=localStorage.getItem("noxPdfNote:"+rec.id)||"";initPdfInk(rec.id);$("#pdfReader").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){alert("تعذر فتح الملف؛ جرّب إعادة اختياره.")}});document.querySelectorAll("[data-del-folder]").forEach(b=>b.onclick=()=>{a.splice(Number(b.dataset.delFolder),1);localStorage.setItem("noxFolders",JSON.stringify(a));renderFolders()})}
function renderCards(){
 let a=JSON.parse(localStorage.getItem("noxCards")||"[]");const q=($("#cardSearch")?.value||"").trim().toLowerCase(),now=Date.now();
 a=a.map((card,i)=>({...card,_i:i,due:Number(card.due)||0}));const due=a.filter(card=>card.due<=now).length;
 const filtered=a.filter(card=>(card.q+" "+card.a).toLowerCase().includes(q));
 $("#cardList").innerHTML='<div class="notice">🧠 للمراجعة الآن: <b>'+due+'</b> بطاقة. قيّم تذكّرك بعد كشف الإجابة؛ المواعيد تُحدّث تلقائيًا.</div>'+ (filtered.length?filtered.map(card=>{const dueLabel=card.due>now?"موعدها: "+new Date(card.due).toLocaleDateString("ar"): "مستحقة للمراجعة";return '<details class="task" style="display:block"><summary>'+escapeHtml(card.q)+'</summary><p>'+escapeHtml(card.a)+'</p><small>'+dueLabel+'</small><div class="actions"><button class="action secondary" data-rate="again" data-i="'+card._i+'">مرة أخرى</button><button class="action secondary" data-rate="hard" data-i="'+card._i+'">صعبة</button><button class="action secondary" data-rate="good" data-i="'+card._i+'">جيدة</button><button class="action secondary" data-rate="easy" data-i="'+card._i+'">سهلة</button><button class="small-btn" data-del-card="'+card._i+'">حذف</button></div></details>'}).join(""):"<p class='sub' style='margin-top:15px'>لا توجد بطاقات مطابقة؛ أضف بطاقة أو غيّر البحث.</p>");
 document.querySelectorAll("[data-del-card]").forEach(b=>b.onclick=()=>{let all=JSON.parse(localStorage.getItem("noxCards")||"[]");all.splice(+b.dataset.delCard,1);localStorage.setItem("noxCards",JSON.stringify(all));renderCards()});
 document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{let all=JSON.parse(localStorage.getItem("noxCards")||"[]"),card=all[+b.dataset.i];if(!card)return;const intervals={again:1,hard:10,good:24,easy:72};card.intervalHours=intervals[b.dataset.rate];card.due=Date.now()+card.intervalHours*3600000;card.lastReview=b.dataset.rate;localStorage.setItem("noxCards",JSON.stringify(all));renderCards()});
 const search=$("#cardSearch");if(search&&!search.dataset.bound){search.dataset.bound="1";search.addEventListener("input",renderCards)}
}
function renderLimits(){let a=JSON.parse(localStorage.getItem("noxLimits")||"[]");$("#limitsList").innerHTML=a.map(x=>`<div class="subject-row"><span>${escapeHtml(x.n)}<small style="display:block;color:var(--muted)">الهدف: ${x.m} دقيقة يوميًا</small></span><span class="pill">هدف فقط</span></div>`).join("")}
function renderTT(){
 const lessonLabels=["الحصة 1","الحصة 2","الحصة 3","الحصة 4","الحصة 1","الحصة 2","الحصة 3","الحصة 4"];
 const weekDays=days.slice(0,6);
 let html='<thead><tr><th rowspan="2" style="border:1px solid var(--line);padding:9px;min-width:90px">اليوم</th><th colspan="4" style="border:1px solid var(--line);padding:9px">الصباح</th><th colspan="4" style="border:1px solid var(--line);padding:9px">بعد الزوال</th></tr><tr>';
 lessonLabels.forEach((t,i)=>html+='<th style="border:1px solid var(--line);padding:8px;min-width:105px">'+t+'</th>');
 html+='</tr></thead><tbody>';
 weekDays.forEach(d=>{
   html+='<tr><th style="border:1px solid var(--line);padding:10px;white-space:nowrap;background:var(--bg)">'+d[0]+'</th>';
   lessonLabels.forEach((t,i)=>{
     const entry=(state.timetable[d[0]]||[])[i],val=typeof entry==="string"?entry:(entry&&entry.subject||"");
     html+='<td style="border:1px solid var(--line);padding:4px;min-width:105px;height:68px"><button data-tt-cell="'+d[0]+'|'+i+'" style="width:100%;height:100%;min-height:58px;background:var(--surface);color:var(--ink);border-radius:3px;padding:7px 5px;white-space:normal;font-weight:600;font-size:12px">'+escapeHtml(val||"")+'</button></td>';
   });
   html+='</tr>';
 });
 $("#ttGrid").innerHTML=html+'</tbody>';
 document.querySelectorAll("[data-tt-cell]").forEach(btn=>btn.onclick=()=>{
   const parts=btn.dataset.ttCell.split("|"),day=parts[0],i=Number(parts[1]),arr=state.timetable[day]||[],entry=arr[i],old=typeof entry==="string"?entry:(entry&&entry.subject||""),value=prompt("اكتب اسم المادة أو المهمة:",old);
   if(value===null)return;
   state.timetable[day]||=[];
   state.timetable[day][i]={subject:value.trim(),time:lessonLabels[i]};
   save();renderTT();renderWeek();
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.addEventListener("click",e=>{
 const slot=e.target.closest("[data-home-slot]");if(slot){const idx=Number(slot.dataset.homeSlot),js=new Date().getDay(),di=js===0?6:js-1,day=days[di][0],current=(state.timetable[day]||[])[idx];const value=prompt("اكتب اسم المادة أو المهمة:",current?.subject||"");if(value!==null){state.timetable[day] ||= [];state.timetable[day][idx]={subject:value.trim(),time:["08:30–09:20","09:30–10:20","10:30–11:20","11:30–12:20","14:00–14:50","15:00–15:50"][idx]};save();renderWeek()}return}
 let b=e.target.closest("[data-open]");if(b)openView(b.dataset.open);
 if(e.target.closest("[data-back]")){const prev=navStack.pop()||"home";if(prev==="home"){$("#view").classList.add("hidden");$("#home").classList.remove("hidden");$("#view").dataset.current="";renderWeek()}else{openView(prev,false)}}
});
$("#settingsBtn").onclick=()=>openView("settings");
renderWeek();
</script>
