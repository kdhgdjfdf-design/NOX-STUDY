.hidden{display:none!important}.back{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--muted);padding:0;margin-bottom:14px}

<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">N</div><div><h1>NOX STUDY</h1><p>مساحتك الهادئة للدراسة</p></div></div>
  <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات" title="الإعدادات">⚙</button>
</header>

<main id="home">
  <section class="panel">
    <div class="panel-head"><div><h2>جدولي الأسبوعي</h2><p class="sub" style="margin:3px 0 0">نظرة سريعة على أسبوعك</p></div><button class="small-btn" data-open="timetable">عرض الجدول ←</button></div>
    <div class="week" id="week"></div><div id="homeTimetable" class="home-timetable"></div>
    <div class="today-note"><span id="todayLabel">خطة اليوم</span><span class="pill" id="classCount">لا توجد حصص مضافة</span></div>
  </section>

  <div class="panel-head" style="padding:0 3px"><div><h2>أقسامك</h2><p class="sub" style="margin:3px 0 0">كل شيء في مكان واضح</p></div></div>
  <div class="sections">
    <button class="section-card red" data-open="summaries"><span class="section-icon">▤</span><span class="section-copy"><strong>الملخصات</strong><span>ملخصاتك، ملفاتك، والبطاقات التعليمية</span></span><span class="chevron">‹</span></button>
    <button class="section-card focus" data-open="tasks"><span class="section-icon">✓</span><span class="section-copy"><strong>المهام</strong><span>واجباتك ومواعيد الاختبارات</span></span><span class="chevron">‹</span></button>
    <button class="section-card green" data-open="friends"><span class="section-icon">♧</span><span class="section-copy"><strong>الأصدقاء والتحديات</strong><span>أضف صديقًا وأرسل طلبًا ليقبله</span></span><span class="chevron">‹</span></button>
    <button class="section-card focus" data-open="wellbeing"><span class="section-icon">◷</span><span class="section-copy"><strong>التركيز ووقت الشاشة</strong><span>جلساتك وأهداف استخدامك في مكان واحد</span></span><span class="chevron">‹</span></button>
    <button class="section-card green" data-open="notebook"><span class="section-icon">✎</span><span class="section-copy"><strong>دفتر الكتابة بالقلم</strong><span>اكتب وارسم واحفظ ملاحظاتك على هذا الجهاز</span></span><span class="chevron">‹</span></button>
  </div>
  <div class="mini-grid">
    <div class="mini"><strong>مهامك القادمة</strong><span id="nextTask">أضف أول مهمة دراسية</span></div>
    <div class="mini"><strong>تقدم هذا الأسبوع</strong><span id="progress">ابدأ أول جلسة لتتبع تقدمك</span></div>

 canvas.onpointermove=e=>{if(!drawing)return;strokes[strokes.length-1].points.push(pos(e));draw()};

 document.querySelectorAll("[data-note-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.noteMode;canvas.dataset.mode=mode;document.querySelectorAll("[data-note-mode]").forEach(x=>x.classList.toggle("active",x===b))});
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);strokes.push({mode:canvas.dataset.mode||"pen",width:Number($("#noteWidth").value),points:[pos(e)]});draw()};
 $("#clearNote").onclick=()=>{if(confirm("مسح كل ما كُتب في الدفتر؟")){strokes=[];save();draw()}};resize();window.addEventListener("resize",resize);
}
function fileDB(){return new Promise((ok,no)=>{const r=indexedDB.open("noxStudyFileStore",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function putStoredFile(item){const db=await fileDB();return new Promise((ok,no)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(item);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>{db.close();no(tx.error)}})}async function readStoredFile(id){const db=await fileDB();return new Promise((ok,no)=>{const q=db.transaction("files","readonly").objectStore("files").get(id);q.onsuccess=()=>{db.close();ok(q.result)};q.onerror=()=>{db.close();no(q.error)}})}async function renderFolders(){let a=JSON.parse(localStorage.getItem("noxFolders")||"[]");$("#folderList").innerHTML=a.length?a.map((x,i)=>`<div class="task"><span>📄 ${escapeHtml(typeof x==="string"?x:x.name)}<small>${escapeHtml(x.fileName||"ملف")} · ${Math.round((x.size||0)/1024)} KB</small></span><div class="actions"><button class="small-btn" data-open-file="${escapeHtml(x.id||"")}">فتح</button><button class="small-btn" data-del-folder="${i}">حذف</button></div></div>`).join(""):"<p>لا توجد ملفات بعد.</p>";document.querySelectorAll("[data-open-file]").forEach(b=>b.onclick=async()=>{try{const rec=await readStoredFile(b.dataset.openFile);if(!rec){alert("هذا ملف قديم أو لم يُحفظ محتواه؛ أعد اختياره من الهاتف.");return}if(!(rec.type==="application/pdf"||rec.fileName.toLowerCase().endsWith(".pdf"))){alert("فتح الملفات داخل التطبيق متاح حاليًا لملفات PDF فقط.");return}if(window.noxPdfUrl)URL.revokeObjectURL(window.noxPdfUrl);window.noxPdfUrl=URL.createObjectURL(rec.blob);$("#pdfTitle").textContent=rec.name;window.noxCurrentFileId=rec.id;$("#pdfFrame").src=window.noxPdfUrl;$("#pdfReader").classList.remove("hidden");$("#pdfReader").classList.remove("notes-open");$("#pdfNotesPanel").classList.remove("open");$("#pdfNotesText").value=localStorage.getItem("noxPdfNote:"+rec.id)||"";initPdfInk(rec.id);$("#pdfReader").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){alert("تعذر فتح الملف؛ جرّب إعادة اختياره.")}});document.querySelectorAll("[data-del-folder]").forEach(b=>b.onclick=()=>{a.splice(Number(b.dataset.delFolder),1);localStorage.setItem("noxFolders",JSON.stringify(a));renderFolders()})}
function renderCards(){
 let a=JSON.parse(localStorage.getItem("noxCards")||"[]");const q=($("#cardSearch")?.value||"").trim().toLowerCase(),now=Date.now();
 a=a.map((card,i)=>({...card,_i:i,due:Number(card.due)||0}));const due=a.filter(card=>card.due<=now).length;
 const filtered=a.filter(card=>(card.q+" "+card.a).toLowerCase().includes(q));
 $("#cardList").innerHTML='<div class="notice">🧠 للمراجعة الآن: <b>'+due+'</b> بطاقة. قيّم تذكّرك بعد كشف الإجابة؛ المواعيد تُحدّث تلقائيًا.</div>'+ (filtered.length?filtered.map(card=>{const dueLabel=card.due>now?"موعدها: "+new Date(card.due).toLocaleDateString("ar"): "مستحقة للمراجعة";return '<details class="task" style="display:block"><summary>'+escapeHtml(card.q)+'</summary><p>'+escapeHtml(card.a)+'</p><small>'+dueLabel+'</small><div class="actions"><button class="action secondary" data-rate="again" data-i="'+card._i+'">مرة أخرى</button><button class="action secondary" data-rate="hard" data-i="'+card._i+'">صعبة</button><button class="action secondary" data-rate="good" data-i="'+card._i+'">جيدة</button><button class="action secondary" data-rate="easy" data-i="'+card._i+'">سهلة</button><button class="small-btn" data-del-card="'+card._i+'">حذف</button></div></details>'}).join(""):"<p class='sub' style='margin-top:15px'>لا توجد بطاقات مطابقة؛ أضف بطاقة أو غيّر البحث.</p>");
 document.querySelectorAll("[data-del-card]").forEach(b=>b.onclick=()=>{let all=JSON.parse(localStorage.getItem("noxCards")||"[]");all.splice(+b.dataset.delCard,1);localStorage.setItem("noxCards",JSON.stringify(all));renderCards()});
 document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{let all=JSON.parse(localStorage.getItem("noxCards")||"[]"),card=all[+b.dataset.i];if(!card)return;const intervals={again:1,hard:10,good:24,easy:72};card.intervalHours=intervals[b.dataset.rate];card.due=Date.now()+card.intervalHours*3600000;card.lastReview=b.dataset.rate;localStorage.setItem("noxCards",JSON.stringify(all));renderCards()});
 const search=$("#cardSearch");if(search&&!search.dataset.bound){search.dataset.bound="1";search.addEventListener("input",renderCards)}
}
function renderLimits(){let a=JSON.parse(localStorage.getItem("noxLimits")||"[]");$("#limitsList").innerHTML=a.map(x=>`<div class="subject-row"><span>${escapeHtml(x.n)}<small style="display:block;color:var(--muted)">الهدف: ${x.m} دقيقة يوميًا</small></span><span class="pill">هدف فقط</span></div>`).join("")}
function renderTT(){
 const lessonLabels=["الحصة 1","الحصة 2","الحصة 3","الحصة 4","الحصة 1","الحصة 2","الحصة 3","الحصة 4"];
 const weekDays=days.slice(0,6);
 let html='<thead><tr><th rowspan="2" style="border:1px solid var(--line);padding:9px;min-width:90px">اليوم</th><th colspan="4" style="border:1px solid var(--line);padding:9px">الصباح</th><th colspan="4" style="border:1px solid var(--line);padding:9px">بعد الزوال</th></tr><tr>';
 lessonLabels.forEach((t,i)=>html+='<th style="border:1px solid var(--line);padding:8px;min-width:105px">'+t+'</th>');
 html+='</tr></thead><tbody>';
 weekDays.forEach(d=>{
   html+='<tr><th style="border:1px solid var(--line);padding:10px;white-space:nowrap;background:var(--bg)">'+d[0]+'</th>';
   lessonLabels.forEach((t,i)=>{
     const entry=(state.timetable[d[0]]||[])[i],val=typeof entry==="string"?entry:(entry&&entry.subject||"");
     html+='<td style="border:1px solid var(--line);padding:4px;min-width:105px;height:68px"><button data-tt-cell="'+d[0]+'|'+i+'" style="width:100%;height:100%;min-height:58px;background:var(--surface);color:var(--ink);border-radius:3px;padding:7px 5px;white-space:normal;font-weight:600;font-size:12px">'+escapeHtml(val||"")+'</button></td>';
   });
   html+='</tr>';
 });
 $("#ttGrid").innerHTML=html+'</tbody>';
 document.querySelectorAll("[data-tt-cell]").forEach(btn=>btn.onclick=()=>{
   const parts=btn.dataset.ttCell.split("|"),day=parts[0],i=Number(parts[1]),arr=state.timetable[day]||[],entry=arr[i],old=typeof entry==="string"?entry:(entry&&entry.subject||""),value=prompt("اكتب اسم المادة أو المهمة:",old);
   if(value===null)return;
   state.timetable[day]||=[];
   state.timetable[day][i]={subject:value.trim(),time:lessonLabels[i]};
   save();renderTT();renderWeek();
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.addEventListener("click",e=>{
 const slot=e.target.closest("[data-home-slot]");if(slot){const idx=Number(slot.dataset.homeSlot),js=new Date().getDay(),di=js===0?6:js-1,day=days[di][0],current=(state.timetable[day]||[])[idx];const value=prompt("اكتب اسم المادة أو المهمة:",current?.subject||"");if(value!==null){state.timetable[day] ||= [];state.timetable[day][idx]={subject:value.trim(),time:["08:30–09:20","09:30–10:20","10:30–11:20","11:30–12:20","14:00–14:50","15:00–15:50"][idx]};save();renderWeek()}return}
 let b=e.target.closest("[data-open]");if(b)openView(b.dataset.open);
 if(e.target.closest("[data-back]")){const prev=navStack.pop()||"home";if(prev==="home"){$("#view").classList.add("hidden");$("#home").classList.remove("hidden");$("#view").dataset.current="";renderWeek()}else{openView(prev,false)}}
});
$("#settingsBtn").onclick=()=>openView("settings");
renderWeek();
</script>
